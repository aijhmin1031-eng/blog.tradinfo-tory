name: Secrets check (one-off)

on:
  push:
    branches: ['claude/**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify DART_API_KEY (실호출)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          if [ -z "$DART_API_KEY" ]; then echo "DART_API_KEY 미등록"; exit 1; fi
          curl -s "https://opendart.fss.or.kr/api/list.json?crtfc_key=$DART_API_KEY&bgn_de=20260815&end_de=20260822&page_count=1" -o /tmp/dart.json
          grep -q '"status":"000"' /tmp/dart.json && echo "DART 응답 정상" || { echo "DART 응답 이상"; head -c 200 /tmp/dart.json; exit 1; }
      - name: Presence report (미소비 키 포함)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
          CUSTOMS_TRADE_API_KEY: ${{ secrets.CUSTOMS_TRADE_API_KEY }}
          USCENSUS_API_KEY: ${{ secrets.USCENSUS_API_KEY }}
        run: |
          for k in DATA_GO_KR_KEY COMTRADE_API_KEY CUSTOMS_TRADE_API_KEY USCENSUS_API_KEY; do
            if [ -z "$(printenv $k)" ]; then echo "$k: ❌ 미등록"; else echo "$k: ✅ 등록됨"; fi
          done
