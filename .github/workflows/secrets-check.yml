name: Secrets check (one-off)

on:
  push:
    branches: ['claude/**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify ECOS_API_KEY
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          if [ -z "$ECOS_API_KEY" ]; then echo "ECOS_API_KEY 미등록"; exit 1; fi
          CODE=$(curl -s -o /tmp/ecos.json -w "%{http_code}" "https://ecos.bok.or.kr/api/StatisticSearch/$ECOS_API_KEY/json/kr/1/1/722Y001/D/20260810/20260821/0101000")
          echo "ECOS HTTP $CODE"
          grep -q '"StatisticSearch"' /tmp/ecos.json && echo "ECOS 응답 정상" || { echo "ECOS 응답 이상"; exit 1; }
      - name: Verify FRED_API_KEY
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then echo "FRED_API_KEY 미등록"; exit 1; fi
          CODE=$(curl -s -o /tmp/fred.json -w "%{http_code}" "https://api.stlouisfed.org/fred/series/observations?series_id=DGS10&api_key=$FRED_API_KEY&file_type=json&limit=1")
          echo "FRED HTTP $CODE"
          grep -q '"observations"' /tmp/fred.json && echo "FRED 응답 정상" || { echo "FRED 응답 이상"; exit 1; }
