name: Secrets check (one-off)

on:
  push:
    branches: ['claude/**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify DATA_GO_KR_KEY (실호출)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          if [ -z "$DATA_GO_KR_KEY" ]; then echo "DATA_GO_KR_KEY 미등록"; exit 1; fi
          CODE=$(curl -s -o /tmp/stk.json -w "%{http_code}" "https://apis.data.go.kr/1160100/service/GetStockSecuritiesInfoService/getStockPriceInfo?serviceKey=$DATA_GO_KR_KEY&resultType=json&numOfRows=1&likeSrtnCd=005930&beginBasDt=20260818")
          echo "HTTP $CODE"
          grep -q '"resultCode":"00"' /tmp/stk.json && echo "주식시세 응답 정상" || { echo "응답 이상"; head -c 200 /tmp/stk.json; exit 1; }
