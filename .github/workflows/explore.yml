name: 일회성 API 탐색
# 키가 CI 에만 있어 로컬로는 확인할 수 없는 API 를 한 번 때려 본다.
# ★ 확인이 끝나면 이 워크플로는 지운다(스크립트는 남겨 재실행할 수 있게 한다).
#
# 2026-09-04: 기업 재무제표 탐색(DART)은 끝나서 걷어 냈다. 지금 재는 것은
# **나라장터 보조정보**다 — 쪽 넘기기가 실제로 도는지, 그리고 소재지 드롭다운을
# 무엇으로 채울지(참가가능지역 표기의 실제 어휘)를 실측한다.
on: { workflow_dispatch: }
permissions: { contents: read }
jobs:
  explore:
    runs-on: ubuntu-latest
    # ★ 시간 제한을 반드시 둔다. 2판을 제한 없이 돌렸다가 22분간 어디에 있는지 몰라
    #   취소했다(기본값은 6시간이다).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # 지역·면허 어휘는 2026-09-04 에 확인을 마쳤다. 지금 재는 것은 공사 공고의
      # 실적·시공능력 필드다(크몽 고객 문의 ②). 값이 안 오면 그 기능은 만들지 않는다.
      - name: 공사 공고 실적·시공능력 필드 실측
        run: node scripts/explore-cnstwk.mjs
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
