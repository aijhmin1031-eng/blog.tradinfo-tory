name: 일회성 API 탐색
# 키가 CI 에만 있어 로컬로는 확인할 수 없는 API 를 한 번 때려 본다.
# ★ 확인이 끝나면 이 워크플로는 지운다(스크립트는 남겨 재실행할 수 있게 한다).
on: { workflow_dispatch: }
permissions: { contents: write }
jobs:
  explore:
    runs-on: ubuntu-latest
    # ★ 시간 제한을 반드시 둔다. 2판을 제한 없이 돌렸다가 22분간 어디에 있는지 몰라
    #   취소했다(기본값은 6시간이다).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/explore-apis.mjs
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      # ★ 수집기를 여기서 한 번 돌려 실제 산출물을 만들고 커밋한다.
      #   정기 파이프라인에 걸기 전에 눈으로 확인하려는 것이다.
      - run: node scripts/pipeline/dart-fs.mjs
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
      - name: 수집 결과 커밋
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/corp-fs data/series || true
          git diff --cached --quiet && echo '변경 없음' || \
            git commit -m "기업 재무제표 수집: $(TZ=Asia/Seoul date +%F)" && git push
