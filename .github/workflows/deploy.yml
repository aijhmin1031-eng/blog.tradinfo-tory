name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'claude/**']
  schedule:
    # 평일 아침 KST 06:50 (UTC 21:50 전일) — 지표 갱신 + 예약 발행분 공개
    - cron: '50 21 * * 0-4'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch latest indicators (optional)
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: npm run fetch-data
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
