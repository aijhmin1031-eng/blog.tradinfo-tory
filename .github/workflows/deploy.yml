name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'claude/**']
  schedule:
    # 매일 아침 KST 06:50 (UTC 21:50 전일) — 지표 수집·브리핑 발행·그날 예약 기사 자동 발행·배포
    - cron: '50 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 품질 점검 — 배포를 막지 않는다(별도 job, needs 없음).
  # 살아 있는 사이트에서 게이트가 배포를 막으면, 기사 한 편의 흠 때문에 사이트 전체가 멎는다.
  # 대신 커밋마다 빨갛게 남겨서 **발행일 아침이 아니라 쓴 날** 결함이 보이게 한다.
  quality:
    name: 품질 점검
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 형식 게이트 (전수)
        run: node scripts/check-quality.mjs --all

      - name: 예약분 사전 점검 (발행일 빌드 사고 예방)
        run: npm run precheck

      - name: 내용 감사 (주장에 검정이 붙어 있는가)
        # 빨간불은 「검정 없음·출처 없음」에만 켠다. 얇음·재탕은 목록에 뜨되 막지 않는다.
        # 경고가 상시로 켜져 있으면 아무도 안 본다.
        run: npm run audit -- --fail-on=90

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Run data pipeline (collect + daily brief)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: npm run pipeline

      - name: Commit accumulated data back to repo
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "tori-pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add data src/data src/content/briefs
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "데이터 파이프라인: 지표 수집·브리핑 발행 ($(date -u +%F))"
            git push
          fi

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
