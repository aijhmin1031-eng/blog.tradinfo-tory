name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'claude/**']
  schedule:
    # 평일 아침 KST 06:50 (UTC 21:50 전일) — 지표 수집·브리핑 발행·배포
    # [임시] 6(UTC 토) = KST 일요일: 2026-08-23 자동화 첫날 1회 예외 — 실행 후 0-4로 되돌릴 것
    - cron: '50 21 * * 0-4,6'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Run data pipeline (collect + daily brief)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: npm run pipeline

      - name: Commit accumulated data back to repo
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "tori-pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add data src/data src/content/briefs
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "데이터 파이프라인: 지표 수집·브리핑 발행 ($(date -u +%F))"
            git push
          fi

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
